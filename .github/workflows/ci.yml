name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-aiohttp http_ece pyyaml packaging
      - name: Install the plugin's declared dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, yaml
          manifest = yaml.safe_load(pathlib.Path('plugin/plugin.yaml').read_text())
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *manifest['python_dependencies']])
          PY
      - run: pytest -q
      - name: Bundled web app is complete
        run: python scripts/check_web_bundle.py

  app:
    name: App typecheck + web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx expo export --platform web
