name: Release

# Push a tag like v0.1.0 to build the Android APK and the plugin bundle and attach them to a
# GitHub Release. Can also be run by hand from the Actions tab (artifacts only, no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Generate native Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p out
          cp app/android/app/build/outputs/apk/release/app-release.apk "out/winglet-${VERSION}.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: winglet-apk
          path: out/*.apk

  plugin:
    name: Plugin bundle (with web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build web app into plugin/web
        run: ./scripts/build-web.sh
      - name: Zip plugin
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p out
          cp -r plugin winglet
          zip -qr "out/winglet-plugin-${VERSION}.zip" winglet -x 'winglet/__pycache__/*'
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: winglet-plugin
          path: out/*.zip

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [android, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
